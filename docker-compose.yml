services:
  postgres:
    image: postgres:17-alpine
    container_name: sitenura-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sitenura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sitenura}
      POSTGRES_DB: ${POSTGRES_DB:-sitenura}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sitenura']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
